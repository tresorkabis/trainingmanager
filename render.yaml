# Render Blueprint for Training Manager
services:
  - type: web
    name: training-manager-web
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "chmod +x start.sh && ./start.sh"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: settings.prod
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: "your-app-name.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://your-app-name.onrender.com"

  - type: postgres
    name: training-manager-db
    plan: free
    databaseName: trainingmanager_db
    userName: trainingmanager_user
