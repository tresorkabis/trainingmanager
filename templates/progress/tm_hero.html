<section class="tm-hero tm-hero--{{ theme }} mb-4">
    <style>
        /* Forcer la disposition horizontale des stats (fallback si un CSS surcharge) */
        .tm-hero__stats-grid{display:flex !important;flex-wrap:wrap !important;gap:0.625rem;justify-content:flex-end;align-items:center}
        .tm-stat-card{flex:0 0 auto !important;min-width:120px}
        .tm-hero__right{display:flex;align-items:center}
        /* Valeurs des stat cards : lisibles sur petit écran (filière, profil, service…) */
        .tm-stat-card__value{
            font-size: 1.15rem !important;
            font-weight: 700 !important;
            line-height: 1.25 !important;
            white-space: normal !important;
            overflow-wrap: break-word !important;
            display: block !important;
        }
        /* Limiter la largeur des stat cards sur mobile pour éviter le débordement */
        @media (max-width: 575.98px){
            .tm-stat-card{min-width:auto !important;flex:1 1 45% !important;}
        }
    </style>
    <div class="tm-hero__layout">
        <div class="tm-hero__left">
            <div class="tm-section-titlebar mb-4">
                {% if photo_url %}
                <img src="{{ photo_url }}" alt="{{ title }}" class="tm-hero__photo">
                {% else %}
                <span class="tm-section-titlebar__icon"><i class="{{ icon }}"></i></span>
                {% endif %}
                <div class="tm-section-titlebar__text">
                    <h3>{{ title }}</h3>
                    <p>{{ subtitle }}</p>
                </div>
            </div>
            {% if actions %}
            <div class="tm-hero__actions">
                {% for action in actions %}
                <a href="{{ action.url }}" class="tm-btn-soft">
                    {% if action.icon %}<i class="{{ action.icon }} me-2"></i>{% endif %}
                    {{ action.label }}
                </a>
                {% endfor %}
            </div>
            {% endif %}
        </div>

        {% if stats %}
        <div class="tm-hero__right">
            <div class="tm-hero__stats-grid">
                {% for stat in stats %}
                <div class="tm-stat-card">
                    <span class="tm-stat-card__label">{{ stat.label }}</span>
                    <span class="tm-stat-card__value">{{ stat.value }}</span>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endif %}
    </div>
</section>
