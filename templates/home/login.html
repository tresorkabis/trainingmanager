{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Training Manager</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'assets/vendors/perfect-scrollbar/perfect-scrollbar.css' %}">
    <link rel="stylesheet" href="{% static 'assets/vendors/bootstrap-icons/bootstrap-icons.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/app.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/pages/auth.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/training-manager.css' %}">
    <style>
        /* Custom styles for a more substantial and modern login page */
        body.tm-login {
            background: linear-gradient(to right top, #eef3ff, #e0e8f7); /* Light blue gradient */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem; /* Increased padding around the card */
            font-family: 'Nunito', sans-serif;
            color: #343a40;
        }

        .tm-login__wrapper {
            width: 100%;
            max-width: 480px; /* Increased max-width for a more generous card size */
            margin: auto;
        }

        .tm-login__card {
            background-color: #ffffff;
            padding: 3rem; /* Increased padding inside the card */
            border-radius: 1rem; /* More rounded corners */
            box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.15); /* More pronounced shadow */
            text-align: center;
            border: 1px solid #e9ecef;
        }

        .tm-login__brand {
            margin-bottom: 2.5rem; /* More space below brand section */
        }

        .tm-login__brand img {
            width: 90px; /* Larger logo */
            height: 90px;
            margin-bottom: 1rem; /* More space between logo and title */
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .tm-login__brand-title {
            font-size: 2.2rem; /* Larger title */
            font-weight: 800;
            color: #25396f; /* Darker blue for brand title */
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .tm-login__brand-subtitle {
            font-size: 1rem; /* Slightly larger subtitle */
            color: #6c757d;
            margin-top: 0;
        }

        .tm-login__title {
            font-size: 1.8rem; /* Larger login title */
            font-weight: 700;
            color: #343a40;
            margin-top: 2.5rem; /* More space above title */
            margin-bottom: 2rem; /* More space below title */
        }

        .tm-login__alert {
            margin-top: 1.5rem;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            border-radius: 0.5rem;
        }

        /* --- Form Input with Icon Styling --- */
        .input-group-with-icon {
            position: relative;
            margin-bottom: 1.5rem; /* More space between input groups */
            box-sizing: border-box; /* Ajout explicite pour s'assurer */
        }

        .input-group-with-icon .form-control {
            padding-left: 3.5rem; /* More space for icon */
            height: calc(2.5rem + 1rem + 2px); /* Taller input fields */
            font-size: 1.15rem; /* Larger font in input */
            border-radius: 0.5rem;
            border: 1px solid #ced4da;
            /* Supprimé: width: 100%; - on se repose sur Bootstrap pour cela */
            box-sizing: border-box; /* Ajout explicite pour s'assurer */
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .input-group-with-icon .form-control:focus {
            border-color: #435ebe; /* Primary theme color on focus */
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(67, 94, 190, 0.25); /* Primary theme shadow on focus */
        }

        .input-group-with-icon .form-control-icon {
            position: absolute;
            left: 1.2rem; /* Icon position */
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
            font-size: 1.3rem; /* Larger icon */
            pointer-events: none;
            z-index: 2;
        }
        /* --- End Form Input with Icon Styling --- */

        .btn-primary {
            background-color: #435ebe; /* Primary theme color */
            border-color: #435ebe;
            font-size: 1.25rem; /* Larger button font */
            padding: 0.9rem 1.5rem; /* More padding for button */
            width: 100%;
            border-radius: 0.5rem;
            margin-top: 2rem; /* More space above button */
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 0.5rem 1rem rgba(67, 94, 190, 0.2); /* Soft shadow for button */
        }

        .btn-primary:hover {
            background-color: #394f9b;
            border-color: #394f9b;
            box-shadow: 0 0.75rem 1.5rem rgba(67, 94, 190, 0.3); /* More pronounced shadow on hover */
            transform: translateY(-2px); /* Slight lift on hover */
        }

        .tm-login__footer {
            margin-top: 2.5rem; /* More space above footer */
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>

<body class="tm-login">
    <div class="tm-login__wrapper">
        <div class="tm-login__card">
            <div class="tm-login__brand">
                <img src="{% static 'assets/images/logo.png' %}" alt="Logo">
                <p class="tm-login__brand-title">Training Manager</p>
                <p class="tm-login__brand-subtitle">Plateforme de gestion des formations</p>
            </div>

            <h1 class="tm-login__title">Connexion</h1>

            {% if message %}
            <div class="alert alert-danger tm-login__alert" role="alert">
                {{ message }}
            </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="input-group-with-icon">
                    <span class="form-control-icon">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" class="form-control" name="username"
                        placeholder="Nom d'utilisateur" required autofocus>
                </div>
                <div class="input-group-with-icon">
                    <span class="form-control-icon">
                        <i class="bi bi-shield-lock"></i>
                    </span>
                    <input type="password" class="form-control" name="password"
                        placeholder="Mot de passe" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Se connecter</button>
            </form>

            <div class="text-center mt-4 fs-6">
                <p class="text-gray-600">Pas de compte ? Contactez l'administrateur de la plateforme.</p>
            </div>
            <div class="tm-login__footer">
                <p>2026 &copy; ESFORCA</p>
            </div>
        </div>
    </div>
</body>

</html>
